name: Build chameleonEsp

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build solution
        run: |
          ./build.bat
        shell: cmd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chameleonEsp-build
          path: chameleonEsp/x64/Release/
          retention-days: 7